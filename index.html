<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>思い出アルバム</title>
  <link rel="stylesheet" href="style.css">
 </head>

<body>
<div id="cameraPage">
  <h1>思い出アルバム</h1>

  <div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <input
      type="text"
      id="tagInput"
      class="tag-input"
      placeholder="メモを残そう（例: カフェ おいしかった）"
    />

    <button id="switchCameraBtn">
      カメラ切替
    </button>

    <button id="captureBtn">撮影して保存</button>

  </div>

  <button class="link-btn" id="openAlbum">アルバムを開く</button>

</div>

<div id="albumPage" style="display:none;">

 <h2>思い出ゲージ</h2> 
 <div class="memory-gauge">
    <div id="memoryBar"></div>
 </div>

 <p id="memoryText">撮った写真：0枚</p>

 <div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="メモを検索">
</div>

<div class="gallery" id="gallery"></div>

 <button id="backCamera">
    カメラへ戻る
 </button>

</div>


<script src="common.js"></script>
<script src="camera.js"></script>
<script src="album.js"></script>

</body>
</html>
